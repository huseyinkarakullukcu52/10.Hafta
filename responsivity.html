<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyarlılık - Responsivity</title>
    <style>
        body{
            background-color: #a8dadc;
        }
        @media screen and (min-width:600px)
        {
            body{
                background-color: #e76f51;
            }
        }
        @media screen and (min-width:800px)
        {
            body{
                background-color: purple;
            }
        }

        @media screen and (min-width:1200px)
        {
            body{
                background-color: #e9c46a;
            }
        }

    </style>
</head>
<body>
    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Illo modi natus quis voluptates vero beatae necessitatibus sed doloremque! Facere nesciunt beatae praesentium consectetur accusantium optio dolore iusto alias libero quidem.
    </p>
</body>
</html>
