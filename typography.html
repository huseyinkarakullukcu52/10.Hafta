<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typography</title>
    <style>
        h1{
            color: blue;
            font-family: Arial, Helvetica, sans-serif;

        }
        p{
            font-size: 14px;
            text-align: justify;
            letter-spacing: 0.1em;

        }
        p::first-line{
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <h1>typography</h1>
    <p>
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Deleniti dolorum qui tempore repellendus culpa, alias, quas in inventore esse quasi magnam ducimus ex itaque accusantium veritatis, aperiam minima odit quos!
    </p>
    
</body>
</html>
